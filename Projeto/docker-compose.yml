services:
  api:
    build: .
    container_name: api-sumarizacao
    ports:
      - "8000:8000"
    volumes:
      # Volume para persistir credenciais do Devin
      - devin-credentials:/root/.local/share/devin
    # Configuração MCP atualizada para usar localhost dentro do container
    environment:
      - MCP_SERVER_URL=http://localhost:8000/mcp
      - DEVIN_PERMISSION_MODE=autonomous

volumes:
  devin-credentials: